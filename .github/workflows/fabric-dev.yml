name: Fabric Dev Deployment

on:
  push:
    branches: [ "dev" ]

permissions:
  id-token: write # For OIDC authentication
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Fabric artifacts
        run: |
          # Add validation scripts (e.g., PBIX linting, DAX checks)
          echo "Running validation..."

      - name: Deploy to Dev Workspace
        run: |
          pwsh -Command "Connect-PowerBIServiceAccount -ServicePrincipal -TenantId '${{ secrets.AZURE_TENANT_ID }}' -Credential (New-Object System.Management.Automation.PSCredential('${{ secrets.AZURE_CLIENT_ID }}', (ConvertTo-SecureString '${{ secrets.AZURE_CLIENT_SECRET }}' -AsPlainText -Force)))"
          pwsh -Command "Publish-FabricArtifacts -WorkspaceId '${{ secrets.FABRIC_DEV_WORKSPACE_ID }}' -Path './artifacts'"